  ChatwithLocalMalaysianFriendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/chat_with_local_malaysian_friend/
      Handler: run.sh
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ============================================================
  # S3 Bucket for Frontend Static Website
  # ============================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

# ============================================================
# Outputs
# ============================================================
Outputs:
  DiagramApiUrl:
    Value: !Sub "https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  BUDGETANALYSISANDRECOMMENDATIONSUrl:
    Value: !GetAtt BUDGETANALYSISANDRECOMMENDATIONSFunctionUrl.FunctionUrl
  TRAVELOVERVIEWUrl:
    Value: !GetAtt TRAVELOVERVIEWFunctionUrl.FunctionUrl
  TRANSPORTANDACCESSIBILITYUrl:
    Value: !GetAtt TRANSPORTANDACCESSIBILITYFunctionUrl.FunctionUrl
  GOVERNMENTSERVICESANDENTRYREQUIREMENTSUrl:
    Value: !GetAtt GOVERNMENTSERVICESANDENTRYREQUIREMENTSFunctionUrl.FunctionUrl
  ESTIMATEDCOSTBREAKDOWNUrl:
    Value: !GetAtt ESTIMATEDCOSTBREAKDOWNFunctionUrl.FunctionUrl
  DETAILEDITINERARYUrl:
    Value: !GetAtt DETAILEDITINERARYFunctionUrl.FunctionUrl
  GOVERNMENTTRAVELSUBSIDIESANDBENEFITSUrl:
    Value: !GetAtt GOVERNMENTTRAVELSUBSIDIESANDBENEFITSFunctionUrl.FunctionUrl
  SAFETYLEGALANDTRAVELERTIPSUrl:
    Value: !GetAtt SAFETYLEGALANDTRAVELERTIPSFunctionUrl.FunctionUrl
  ChatwithLocalMalaysianFriendUrl:
    Value: !GetAtt ChatwithLocalMalaysianFriendFunctionUrl.FunctionUrl
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Value: !Ref FrontendBucket
