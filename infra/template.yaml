AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Travel Malaysia - AI-powered travel planning (ap-southeast-1, Function URLs)

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: python3.12

Resources:
  # ============================================================
  # IAM Role
  # ============================================================
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "SmartTravelMY-Role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockFullAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                  - aws-marketplace:Unsubscribe
                Resource: "*"

  # ============================================================
  # Text Lambdas with Function URLs (no timeout limit)
  # ============================================================
  BudgetAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/budget_analysis_and_recommendations/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  TravelOverviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/travel_overview/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  TransportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/transport_and_accessibility/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  GovernmentServicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/government_services_and_entry_requirements/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  CostBreakdownFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/estimated_cost_breakdown/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  ItineraryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/detailed_itinerary/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Timeout: 180
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  SubsidiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/government_travel_subsidies_and_benefits/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  SafetyTipsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/safety_legal_and_traveler_tips/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/chat_with_local_malaysian_friend/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  MomentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/travel_moments/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  SummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/travel_summary/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  ImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/destination_visual_preview/
      Handler: app.handler
      Timeout: 60
      MemorySize: 1024
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type

  # ============================================================
  # S3 Bucket for Frontend
  # ============================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

Outputs:
  BudgetAnalysisUrl:
    Value: !GetAtt BudgetAnalysisFunctionUrl.FunctionUrl
  TravelOverviewUrl:
    Value: !GetAtt TravelOverviewFunctionUrl.FunctionUrl
  TransportUrl:
    Value: !GetAtt TransportFunctionUrl.FunctionUrl
  GovernmentServicesUrl:
    Value: !GetAtt GovernmentServicesFunctionUrl.FunctionUrl
  CostBreakdownUrl:
    Value: !GetAtt CostBreakdownFunctionUrl.FunctionUrl
  ItineraryUrl:
    Value: !GetAtt ItineraryFunctionUrl.FunctionUrl
  SubsidiesUrl:
    Value: !GetAtt SubsidiesFunctionUrl.FunctionUrl
  SafetyTipsUrl:
    Value: !GetAtt SafetyTipsFunctionUrl.FunctionUrl
  ChatUrl:
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  MomentsUrl:
    Value: !GetAtt MomentsFunctionUrl.FunctionUrl
  SummaryUrl:
    Value: !GetAtt SummaryFunctionUrl.FunctionUrl
  ImageUrl:
    Value: !GetAtt ImageFunctionUrl.FunctionUrl
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Value: !Ref FrontendBucket
