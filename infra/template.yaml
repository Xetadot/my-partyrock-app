AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Travel Malaysia - AI-powered travel planning app

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:
  # ============================================================
  # IAM Role for Bedrock Access
  # ============================================================
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "SmartTravelMalaysia-BedrockRole-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:aws:bedrock:ap-southeast-5:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-sonnet-4-6"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-sonnet-4-6"
                  - "arn:aws:bedrock:::foundation-model/anthropic.claude-sonnet-4-6"
                  - !Sub "arn:aws:bedrock:ap-southeast-5:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0"
                  - "arn:aws:bedrock:*::foundation-model/stability.*"
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                  - aws-marketplace:Unsubscribe
                Resource: "*"
              - Effect: Allow
                Action:
                  - geo:SearchPlaceIndex*
                  - geo:GetPlace
                  - geo:GetMap*
                Resource: "*"

  # ============================================================
  # API Gateway
  # ============================================================
  AppApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type'"
              Access-Control-Allow-Methods: "'POST,OPTIONS'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type'"
              Access-Control-Allow-Methods: "'POST,OPTIONS'"

  # ============================================================
  # Image Generation Lambda
  # ============================================================
  DestinationVisualPreviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/destination_visual_preview/
      Handler: app.handler
      Timeout: 30
      MemorySize: 512
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /image
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /image
            Method: OPTIONS

  # ============================================================
  # Text Generation Lambdas
  # ============================================================
  BUDGETANALYSISANDRECOMMENDATIONSFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/budget_analysis_and_recommendations/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /budget-analysis
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /budget-analysis
            Method: OPTIONS

  TRAVELOVERVIEWFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/travel_overview/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /travel-overview
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /travel-overview
            Method: OPTIONS

  TRANSPORTANDACCESSIBILITYFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/transport_and_accessibility/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /transport
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /transport
            Method: OPTIONS

  GOVERNMENTSERVICESANDENTRYREQUIREMENTSFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/government_services_and_entry_requirements/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /government-services
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /government-services
            Method: OPTIONS

  ESTIMATEDCOSTBREAKDOWNFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/estimated_cost_breakdown/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /cost-breakdown
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /cost-breakdown
            Method: OPTIONS

  DETAILEDITINERARYFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/detailed_itinerary/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /itinerary
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /itinerary
            Method: OPTIONS

  GOVERNMENTTRAVELSUBSIDIESANDBENEFITSFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/government_travel_subsidies_and_benefits/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /subsidies
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /subsidies
            Method: OPTIONS

  SAFETYLEGALANDTRAVELERTIPSFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/safety_legal_and_traveler_tips/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /safety-tips
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /safety-tips
            Method: OPTIONS

  ChatwithLocalMalaysianFriendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/chat_with_local_malaysian_friend/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /chat
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /chat
            Method: OPTIONS

  TravelMomentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/travel_moments/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /moments
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /moments
            Method: OPTIONS

  TravelSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/travel_summary/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /summary
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /summary
            Method: OPTIONS

  AccommodationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/accommodations/
      Handler: app.handler
      Timeout: 90
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /accommodations
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /accommodations
            Method: OPTIONS

  # ============================================================
  # Amazon Location Service
  # ============================================================
  TravelMap:
    Type: AWS::Location::Map
    Properties:
      MapName: SmartTravelMalaysiaMap
      Configuration:
        Style: VectorGrabStandardLight

  TravelPlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: SmartTravelMalaysiaPlaces
      DataSource: Grab

  PlacesSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/places_search/
      Handler: app.handler
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /places
            Method: POST
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /places
            Method: OPTIONS

  # ============================================================
  # S3 Bucket for Frontend Static Website
  # ============================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiUrl:
    Value: !Sub "https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Value: !Ref FrontendBucket
