name: Deploy Smart Travel Malaysia

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name smart-travel-malaysia \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-1 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject URLs into frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name smart-travel-malaysia \
              --region ap-southeast-1 \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          # Inject each Function URL
          sed -i "s|__URL_BUDGET__|$(get_output BudgetAnalysisUrl)|g" frontend/index.html
          sed -i "s|__URL_OVERVIEW__|$(get_output TravelOverviewUrl)|g" frontend/index.html
          sed -i "s|__URL_TRANSPORT__|$(get_output TransportUrl)|g" frontend/index.html
          sed -i "s|__URL_GOVERNMENT__|$(get_output GovernmentServicesUrl)|g" frontend/index.html
          sed -i "s|__URL_COST__|$(get_output CostBreakdownUrl)|g" frontend/index.html
          sed -i "s|__URL_ITINERARY__|$(get_output ItineraryUrl)|g" frontend/index.html
          sed -i "s|__URL_SUBSIDIES__|$(get_output SubsidiesUrl)|g" frontend/index.html
          sed -i "s|__URL_SAFETY__|$(get_output SafetyTipsUrl)|g" frontend/index.html
          sed -i "s|__URL_CHAT__|$(get_output ChatUrl)|g" frontend/index.html
          sed -i "s|__URL_MOMENTS__|$(get_output MomentsUrl)|g" frontend/index.html
          sed -i "s|__URL_SUMMARY__|$(get_output SummaryUrl)|g" frontend/index.html
          sed -i "s|__URL_IMAGE__|$(get_output ImageUrl)|g" frontend/index.html
          sed -i "s|__PEXELS_API_KEY__|${{ secrets.PEXELS_API_KEY }}|g" frontend/index.html

      - name: Deploy Frontend to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name smart-travel-malaysia \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/ s3://$BUCKET_NAME/ --cache-control no-cache

      - name: Print Website URL
        run: |
          WEBSITE_URL=$(aws cloudformation describe-stacks \
            --stack-name smart-travel-malaysia \
            --region ap-southeast-1 \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text)
          echo "🌐 Website deployed at: $WEBSITE_URL"
