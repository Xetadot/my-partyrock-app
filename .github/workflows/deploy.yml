name: Deploy Smart Travel Malaysia

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name smart-travel-malaysia \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs and Inject URLs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name smart-travel-malaysia \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          DIAGRAM_URL=$(get_output DiagramApiUrl)
          sed -i "s|__DIAGRAM_API_URL__|$DIAGRAM_URL|g" frontend/index.html

          URL=$(get_output BUDGETANALYSISANDRECOMMENDATIONSUrl)
          sed -i "s|__URL_BUDGET_ANALYSIS_AND_RECOMMENDATIONS__|$URL|g" frontend/index.html

          URL=$(get_output TRAVELOVERVIEWUrl)
          sed -i "s|__URL_TRAVEL_OVERVIEW__|$URL|g" frontend/index.html

          URL=$(get_output TRANSPORTANDACCESSIBILITYUrl)
          sed -i "s|__URL_TRANSPORT_AND_ACCESSIBILITY__|$URL|g" frontend/index.html

          URL=$(get_output GOVERNMENTSERVICESANDENTRYREQUIREMENTSUrl)
          sed -i "s|__URL_GOVERNMENT_SERVICES_AND_ENTRY_REQUIREMENTS__|$URL|g" frontend/index.html

          URL=$(get_output ESTIMATEDCOSTBREAKDOWNUrl)
          sed -i "s|__URL_ESTIMATED_COST_BREAKDOWN__|$URL|g" frontend/index.html

          URL=$(get_output DETAILEDITINERARYUrl)
          sed -i "s|__URL_DETAILED_ITINERARY__|$URL|g" frontend/index.html

          URL=$(get_output GOVERNMENTTRAVELSUBSIDIESANDBENEFITSUrl)
          sed -i "s|__URL_GOVERNMENT_TRAVEL_SUBSIDIES_AND_BENEFITS__|$URL|g" frontend/index.html

          URL=$(get_output SAFETYLEGALANDTRAVELERTIPSUrl)
          sed -i "s|__URL_SAFETY_LEGAL_AND_TRAVELER_TIPS__|$URL|g" frontend/index.html

          URL=$(get_output ChatwithLocalMalaysianFriendUrl)
          sed -i "s|__URL_CHAT_WITH_LOCAL_MALAYSIAN_FRIEND__|$URL|g" frontend/index.html

      - name: Deploy Frontend to S3
        run: |
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name smart-travel-malaysia \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          aws s3 sync frontend/ s3://$BUCKET_NAME/ --cache-control no-cache

      - name: Print Website URL
        run: |
          WEBSITE_URL=$(aws cloudformation describe-stacks \
            --stack-name smart-travel-malaysia \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" \
            --output text)
          echo "🌐 Website deployed at: $WEBSITE_URL"
